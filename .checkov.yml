# Checkov configuration for BIA project
# Documentation: https://www.checkov.io/2.Basics/CLI%20Command%20Reference.html

# Framework to scan
framework:
  - terraform

# Directories to scan
directory:
  - "."

# Files to skip
skip-path:
  - ".terraform/"
  - ".git/"
  - "*.tfvars"

# Checks to skip (use with caution)
# Remove these as security improvements are implemented
skip-check:
  - CKV_AWS_16   # RDS encryption - will be fixed in security phase
  - CKV_AWS_17   # RDS backup retention - acceptable for dev
  - CKV_AWS_23   # Security group egress - required for ECS
  - CKV_AWS_79   # Security group ingress - will be restricted later
  - CKV_AWS_260  # Security group description - acceptable
  - CKV_AWS_261  # Security group description - acceptable

# Output format
output:
  - cli
  - sarif

# Severity levels to report
# compact: Only show failed checks
# quiet: Minimal output
compact: false
quiet: false

# Enable/disable specific features
download-external-modules: false
evaluate-variables: true

# Custom policies directory (if any)
# external-checks-dir: ./custom-policies

# Baseline file to compare against
# baseline: .checkov.baseline

# Soft fail mode (don't exit with error code)
soft-fail: false

# Hard fail on specific severity levels
hard-fail-on:
  - CRITICAL
  - HIGH

# Enable secrets scanning
enable-secret-scan-all-files: true

# Secrets scanning configuration
secrets:
  # Skip files for secrets scanning
  skip-files:
    - "*.md"
    - "*.txt"
    - ".git/"
  
  # Additional entropy threshold for secrets detection
  entropy-threshold: 4.5

# Performance settings
# parallel: 4  # Number of parallel processes
# quiet: false # Reduce output verbosity

# Integration settings
# prisma-api-url: https://api.prismacloud.io
# bc-api-key: your-api-key  # For Bridgecrew Cloud integration

# Custom severity mapping
# severity-mapping:
#   CKV_AWS_1: HIGH
#   CKV_AWS_2: MEDIUM