name: Deploy Development

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY-DEV" to confirm deployment'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to Development
    runs-on: ubuntu-latest
    
    steps:
    - name: Validate confirmation
      if: github.event.inputs.confirm != 'DEPLOY-DEV'
      run: |
        echo "❌ Deployment cancelled. You must type 'DEPLOY-DEV' to confirm."
        exit 1

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.6

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Terraform Init
      run: terraform init -reconfigure -backend-config=backend-dev.hcl

    - name: Terraform Plan
      run: terraform plan -var="environment=dev" -out=tfplan-dev

    - name: Terraform Apply
      run: terraform apply -auto-approve tfplan-dev

    - name: Show Outputs
      run: |
        echo "✅ Development deployment completed successfully!"
        echo "📋 Resource outputs:"
        terraform output