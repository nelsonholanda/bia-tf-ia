name: Deploy Development

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY-DEV" to confirm deployment'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to Development
    runs-on: ubuntu-latest
    
    steps:
    - name: Validate confirmation
      if: github.event.inputs.confirm != 'DEPLOY-DEV'
      run: |
        echo "❌ Deployment cancelled. You must type 'DEPLOY-DEV' to confirm."
        exit 1

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.6

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Terraform Init
      run: terraform init -reconfigure -backend-config=backend-dev.hcl

    - name: Clean up orphaned secrets
      run: |
        # Check for orphaned secrets using AWS CLI directly
        echo "🔍 Checking for orphaned secrets in development..."
        PENDING_SECRETS=$(aws secretsmanager list-secrets --include-planned-deletion \
          --query 'SecretList[?contains(Name, `bia-dev`) && DeletedDate].ARN' --output text)
        
        if [ ! -z "$PENDING_SECRETS" ]; then
          echo "🗑️ Found orphaned secrets, cleaning up..."
          for secret in $PENDING_SECRETS; do
            echo "Deleting secret: $secret"
            aws secretsmanager delete-secret --secret-id $secret --force-delete-without-recovery
          done
          echo "✅ Orphaned secrets cleanup completed"
        else
          echo "✅ No orphaned secrets found"
        fi

    - name: Terraform Plan
      run: terraform plan -var="environment=dev" -out=tfplan-dev

    - name: Terraform Apply
      run: terraform apply -auto-approve tfplan-dev

    - name: Show Outputs
      run: |
        echo "✅ Development deployment completed successfully!"
        echo "📋 Resource outputs:"
        terraform output