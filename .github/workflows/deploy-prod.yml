name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "DEPLOY-PROD" to confirm production deployment'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
    - name: Validate Confirmation
      run: |
        if [ "${{ github.event.inputs.confirmation }}" != "DEPLOY-PROD" ]; then
          echo "❌ Invalid confirmation. You must type 'DEPLOY-PROD' to proceed."
          exit 1
        fi
        echo "✅ Confirmation validated. Proceeding with production deployment..."

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.6

    - name: Verify Terraform Version
      run: terraform version

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Terraform Init
      run: terraform init -reconfigure -backend-config=backend-prod.hcl

    - name: Terraform Validate
      run: terraform validate

    - name: Clean up orphaned secrets
      run: |
        if [ -f "./cleanup-secrets.sh" ]; then
          chmod +x ./cleanup-secrets.sh
          ./cleanup-secrets.sh prod
        else
          echo "⚠️ cleanup-secrets.sh not found, skipping secrets cleanup"
        fi

    - name: Terraform Plan
      run: terraform plan -var-file=terraform-prod.tfvars -out=tfplan-prod

    - name: Terraform Apply
      run: terraform apply -auto-approve tfplan-prod

    - name: Show Outputs
      run: |
        echo "✅ Production deployment completed successfully!"
        echo "📋 Resource outputs:"
        terraform output