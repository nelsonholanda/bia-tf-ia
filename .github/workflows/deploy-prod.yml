name: Deploy Production Environment

on:
  push:
    branches: [ prod ]
    paths:
      - 'terraform/**'
      - '.github/workflows/**'

env:
  TF_VERSION: '1.5.0'
  AWS_REGION: 'us-east-1'
  ENVIRONMENT: 'prod'

jobs:
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Configure AWS credentials using OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GIT_ACTIONS
        role-session-name: GitHubActions-Prod-Deploy-${{ github.run_id }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Terraform Format Check
      run: terraform fmt -check -recursive

    - name: Terraform Init
      run: terraform init -backend-config="backend-prod.hcl"

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      run: |
        terraform plan -var="environment=prod" -out=tfplan-prod
        echo "## 📋 Terraform Plan - Production Environment" >> $GITHUB_STEP_SUMMARY
        echo "Plan generated successfully for production environment" >> $GITHUB_STEP_SUMMARY

    - name: Terraform Apply
      run: |
        terraform apply tfplan-prod
        echo "## ✅ Deployment Complete - Production Environment" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: Successfully deployed" >> $GITHUB_STEP_SUMMARY
        echo "- **Triggered by**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

    - name: Get Outputs
      run: |
        echo "## 🔗 Environment Information" >> $GITHUB_STEP_SUMMARY
        ALB_DNS=$(terraform output -raw alb_dns_name 2>/dev/null || echo "Not available")
        CLUSTER_ARN=$(terraform output -raw cluster_arn 2>/dev/null || echo "Not available")
        echo "- **ALB DNS**: $ALB_DNS" >> $GITHUB_STEP_SUMMARY
        echo "- **ECS Cluster**: $CLUSTER_ARN" >> $GITHUB_STEP_SUMMARY
        echo "- **Resources**: $(terraform state list | wc -l) managed resources" >> $GITHUB_STEP_SUMMARY