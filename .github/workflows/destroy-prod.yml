name: Destroy Production Environment

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "DESTROY-PROD" to confirm infrastructure destruction'
        required: true
        type: string

env:
  TF_VERSION: '1.5.0'
  AWS_REGION: 'us-east-1'
  ENVIRONMENT: 'prod'

jobs:
  validate-destroy:
    name: Validate Destroy Request
    runs-on: ubuntu-latest
    outputs:
      should_destroy: ${{ steps.validate.outputs.should_destroy }}
    steps:
    - name: Validate confirmation
      id: validate
      run: |
        if [ "${{ inputs.confirm_destroy }}" = "DESTROY-PROD" ]; then
          echo "should_destroy=true" >> $GITHUB_OUTPUT
          echo "✅ Destroy confirmation validated for PRODUCTION environment"
        else
          echo "should_destroy=false" >> $GITHUB_OUTPUT
          echo "❌ Invalid confirmation. You must type 'DESTROY-PROD' to confirm."
          exit 1
        fi

  destroy-prod:
    name: Destroy Production Infrastructure
    runs-on: ubuntu-latest
    needs: validate-destroy
    if: needs.validate-destroy.outputs.should_destroy == 'true'
    environment: production-destroy
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Configure AWS credentials using OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::194722426008:role/GIT_ACTIONS
        role-session-name: GitHubActions-Prod-Destroy-${{ github.run_id }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Terraform Init
      run: terraform init -backend-config="backend-prod.hcl"

    - name: Check Current State
      id: check_state
      run: |
        echo "## 📊 Current Infrastructure State - Production" >> $GITHUB_STEP_SUMMARY
        
        RESOURCE_COUNT=$(terraform state list 2>/dev/null | wc -l || echo "0")
        echo "- **Total Resources**: $RESOURCE_COUNT" >> $GITHUB_STEP_SUMMARY
        
        if [ "$RESOURCE_COUNT" -eq "0" ]; then
          echo "no_resources=true" >> $GITHUB_OUTPUT
          echo "- **Status**: No resources to destroy" >> $GITHUB_STEP_SUMMARY
        else
          echo "no_resources=false" >> $GITHUB_OUTPUT
          echo "- **Status**: Resources found, proceeding with destroy" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Key Resources to be Destroyed:" >> $GITHUB_STEP_SUMMARY
          terraform state list | grep -E "(vpc|cluster|rds|alb)" | head -10 | while read resource; do
            echo "- $resource" >> $GITHUB_STEP_SUMMARY
          done
        fi

    - name: Terraform Destroy Plan
      if: steps.check_state.outputs.no_resources != 'true'
      run: |
        echo "## 🗑️ Destroy Plan - Production Environment" >> $GITHUB_STEP_SUMMARY
        terraform plan -destroy -var="environment=prod" -out=destroy-plan-prod

    - name: Terraform Destroy
      if: steps.check_state.outputs.no_resources != 'true'
      run: |
        echo "## 🚨 Executing Destroy - Production Environment" >> $GITHUB_STEP_SUMMARY
        echo "Starting infrastructure destruction for production environment..." >> $GITHUB_STEP_SUMMARY
        
        terraform apply destroy-plan-prod
        
        echo "✅ Production infrastructure successfully destroyed" >> $GITHUB_STEP_SUMMARY

    - name: Verify Destruction
      if: steps.check_state.outputs.no_resources != 'true'
      run: |
        echo "## ✅ Destruction Verification - Production" >> $GITHUB_STEP_SUMMARY
        
        REMAINING_RESOURCES=$(terraform state list 2>/dev/null | wc -l || echo "0")
        
        if [ "$REMAINING_RESOURCES" -eq "0" ]; then
          echo "- **Status**: ✅ All resources successfully destroyed" >> $GITHUB_STEP_SUMMARY
          echo "- **Remaining Resources**: 0" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Status**: ⚠️ Some resources may still exist" >> $GITHUB_STEP_SUMMARY
          echo "- **Remaining Resources**: $REMAINING_RESOURCES" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "- **Destroyed by**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Timestamp**: $(date -u)" >> $GITHUB_STEP_SUMMARY