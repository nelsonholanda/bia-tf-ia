name: Destroy Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DESTROY-PRODUCTION" to confirm destruction'
        required: true
        type: string

jobs:
  destroy:
    name: Destroy Production Environment
    runs-on: ubuntu-latest
    
    steps:
    - name: Validate confirmation
      if: github.event.inputs.confirm != 'DESTROY-PRODUCTION'
      run: |
        echo "❌ Destruction cancelled. You must type 'DESTROY-PRODUCTION' to confirm."
        exit 1

    - name: Additional Safety Check
      run: |
        echo "⚠️  WARNING: You are about to destroy the PRODUCTION environment!"
        echo "🔒 This action will remove all production resources permanently."
        echo "✅ Confirmation received: ${{ github.event.inputs.confirm }}"

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.6

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Terraform Init
      run: terraform init -reconfigure -backend-config=backend-prod.hcl

    - name: Terraform Destroy
      run: terraform destroy -var="environment=prod" -auto-approve

    - name: Verify Destruction
      run: |
        echo "🔍 Verifying production resources were destroyed..."
        
        # Check if main resources still exist
        if aws ecs describe-clusters --clusters bia-prod-cluster --region us-east-1 2>/dev/null; then
          echo "⚠️  ECS cluster still exists"
        else
          echo "✅ ECS cluster destroyed"
        fi
        
        if aws rds describe-db-instances --db-instance-identifier bia-prod-db --region us-east-1 2>/dev/null; then
          echo "⚠️  RDS instance still exists"
        else
          echo "✅ RDS instance destroyed"
        fi
        
        echo "🗑️  Production environment destruction completed!"