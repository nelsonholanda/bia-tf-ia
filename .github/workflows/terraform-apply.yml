name: Terraform Apply

on:
  push:
    branches: [ main, prod ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - prod
      auto_approve:
        description: 'Auto approve apply'
        required: false
        default: false
        type: boolean

env:
  TF_VERSION: '1.12.2'

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/prod' && 'prod' || 'dev') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event.inputs.environment }}" != "" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Init
        run: terraform init -backend-config=backend-${{ steps.env.outputs.environment }}.hcl

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file=terraform-${{ steps.env.outputs.environment }}.tfvars \
            -out=tfplan

      - name: Terraform Apply (Auto)
        if: ${{ github.event.inputs.auto_approve == 'true' || steps.env.outputs.environment == 'dev' }}
        run: terraform apply tfplan

      - name: Terraform Apply (Manual Approval Required)
        if: ${{ github.event.inputs.auto_approve != 'true' && steps.env.outputs.environment == 'prod' }}
        run: |
          echo "## Production Deployment Requires Manual Approval" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please review the plan and approve the deployment manually." >> $GITHUB_STEP_SUMMARY
          terraform apply tfplan

      - name: Terraform Output
        run: terraform output -json > terraform-outputs.json

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ steps.env.outputs.environment }}
          path: terraform-outputs.json

      - name: Post-deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Terraform Version**: ${{ env.TF_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Time**: $(date)" >> $GITHUB_STEP_SUMMARY

  post-deployment:
    name: Post-Deployment Checks
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: always()
    steps:
      - name: Health checks
        run: |
          echo "## Post-Deployment Health Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] RDS instance accessible" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] ALB health check passing" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] ECS service running" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Backup jobs scheduled" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please verify these checks manually." >> $GITHUB_STEP_SUMMARY
