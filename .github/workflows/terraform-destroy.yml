name: Terraform Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy (dev or prod)'
        required: true
        type: choice
        options:
          - dev
          - prod
      confirm_destroy:
        description: 'Type "DESTROY" to confirm infrastructure destruction'
        required: true
        type: string
      aws_region:
        description: 'AWS region'
        required: false
        type: string
        default: 'us-east-1'

env:
  TF_VERSION: '1.5.0'
  AWS_REGION: ${{ inputs.aws_region }}
  ENVIRONMENT: ${{ inputs.environment }}

jobs:
  validate-destroy:
    name: Validate Destroy Request
    runs-on: ubuntu-latest
    outputs:
      should_destroy: ${{ steps.validate.outputs.should_destroy }}
    steps:
    - name: Validate confirmation
      id: validate
      run: |
        if [ "${{ inputs.confirm_destroy }}" = "DESTROY" ]; then
          echo "should_destroy=true" >> $GITHUB_OUTPUT
          echo "✅ Destroy confirmation validated"
        else
          echo "should_destroy=false" >> $GITHUB_OUTPUT
          echo "❌ Invalid confirmation. You must type 'DESTROY' to confirm."
          exit 1
        fi

  terraform-destroy:
    name: Destroy ${{ inputs.environment }} Infrastructure
    runs-on: ubuntu-latest
    needs: validate-destroy
    if: needs.validate-destroy.outputs.should_destroy == 'true'
    environment: 
      name: ${{ inputs.environment == 'prod' && 'production-destroy' || 'development-destroy' }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Configure AWS credentials using OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GIT_ACTIONS
        role-session-name: GitHubActions-Destroy-${{ inputs.environment }}-${{ github.run_id }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Terraform Init
      run: terraform init -backend-config="backend-${{ inputs.environment }}.hcl"

    - name: Check Current State
      id: check_state
      run: |
        echo "## 📊 Current Infrastructure State" >> $GITHUB_STEP_SUMMARY
        
        # Count resources
        RESOURCE_COUNT=$(terraform state list 2>/dev/null | wc -l || echo "0")
        echo "- **Total Resources**: $RESOURCE_COUNT" >> $GITHUB_STEP_SUMMARY
        
        if [ "$RESOURCE_COUNT" -eq "0" ]; then
          echo "no_resources=true" >> $GITHUB_OUTPUT
          echo "- **Status**: No resources to destroy" >> $GITHUB_STEP_SUMMARY
        else
          echo "no_resources=false" >> $GITHUB_OUTPUT
          echo "- **Status**: Resources found, proceeding with destroy" >> $GITHUB_STEP_SUMMARY
          
          # List key resources
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Key Resources to be Destroyed:" >> $GITHUB_STEP_SUMMARY
          terraform state list | grep -E "(vpc|cluster|rds|alb)" | head -10 | while read resource; do
            echo "- $resource" >> $GITHUB_STEP_SUMMARY
          done
        fi

    - name: Terraform Destroy Plan
      if: steps.check_state.outputs.no_resources != 'true'
      run: |
        echo "## 🗑️ Destroy Plan" >> $GITHUB_STEP_SUMMARY
        terraform plan -destroy -var="environment=${{ inputs.environment }}" -out=destroy-plan-${{ inputs.environment }}

    - name: Terraform Destroy
      if: steps.check_state.outputs.no_resources != 'true'
      run: |
        echo "## 🚨 Executing Destroy" >> $GITHUB_STEP_SUMMARY
        echo "Starting infrastructure destruction for ${{ inputs.environment }} environment..." >> $GITHUB_STEP_SUMMARY
        
        terraform apply destroy-plan-${{ inputs.environment }}
        
        echo "✅ Infrastructure successfully destroyed" >> $GITHUB_STEP_SUMMARY

    - name: Verify Destruction
      if: steps.check_state.outputs.no_resources != 'true'
      run: |
        echo "## ✅ Destruction Verification" >> $GITHUB_STEP_SUMMARY
        
        REMAINING_RESOURCES=$(terraform state list 2>/dev/null | wc -l || echo "0")
        
        if [ "$REMAINING_RESOURCES" -eq "0" ]; then
          echo "- **Status**: ✅ All resources successfully destroyed" >> $GITHUB_STEP_SUMMARY
          echo "- **Remaining Resources**: 0" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Status**: ⚠️ Some resources may still exist" >> $GITHUB_STEP_SUMMARY
          echo "- **Remaining Resources**: $REMAINING_RESOURCES" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Remaining Resources:" >> $GITHUB_STEP_SUMMARY
          terraform state list | while read resource; do
            echo "- $resource" >> $GITHUB_STEP_SUMMARY
          done
        fi

    - name: Cleanup State
      if: steps.check_state.outputs.no_resources != 'true'
      continue-on-error: true
      run: |
        # Optional: Clean up any remaining state if needed
        echo "Cleanup completed"

  notify-completion:
    name: Notify Destruction Complete
    runs-on: ubuntu-latest
    needs: [validate-destroy, terraform-destroy]
    if: always() && needs.validate-destroy.outputs.should_destroy == 'true'
    steps:
    - name: Summary
      run: |
        echo "## 🎯 Destruction Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Requested by**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ${{ needs.terraform-destroy.result == 'success' && '✅ Successfully destroyed' || '❌ Destruction failed' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Timestamp**: $(date -u)" >> $GITHUB_STEP_SUMMARY