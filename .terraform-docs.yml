formatter: "markdown table"

version: ""

header-from: main.tf
footer-from: ""

recursive:
  enabled: false
  path: modules

sections:
  hide: []
  show: []

content: |-
  # BIA Infrastructure as Code

  {{ .Header }}

  ## Usage

  ```hcl
  # Development environment
  terraform init -backend-config=backend-dev.hcl
  terraform plan -var-file=terraform.tfvars
  terraform apply -var-file=terraform.tfvars

  # Production environment
  terraform init -backend-config=backend-prod.hcl
  terraform plan -var-file=terraform-prod.tfvars
  terraform apply -var-file=terraform-prod.tfvars
  ```

  ## Requirements

  {{ .Requirements }}

  ## Providers

  {{ .Providers }}

  ## Modules

  {{ .Modules }}

  ## Resources

  {{ .Resources }}

  ## Inputs

  {{ .Inputs }}

  ## Outputs

  {{ .Outputs }}

  ## Security

  This project implements several security best practices:

  - **Encryption at Rest**: All data is encrypted using AWS KMS
  - **Encryption in Transit**: All connections use TLS/SSL
  - **Network Security**: VPC with private subnets and security groups
  - **Access Control**: IAM roles with least privilege principle
  - **Secrets Management**: AWS Secrets Manager for sensitive data
  - **Backup Strategy**: Cross-region backups with AWS Backup
  - **Monitoring**: CloudWatch logs and alarms

  ## Documentation

  - [Architecture Documentation](ARCHITECTURE.md)
  - [Backup Strategy](AWS_BACKUP_STRATEGY_CROSS_REGION.md)
  - [GitOps Audit Report](GITOPS_AUDIT_REPORT.md)
  - [Changelog](CHANGELOG.md)

  {{ .Footer }}

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

output-values:
  enabled: false
  from: ""

sort:
  enabled: true
  by: name

settings:
  anchor: true
  color: true
  default: true
  description: false
  escape: true
  hide-empty: false
  html: true
  indent: 2
  lockfile: true
  read-comments: true
  required: true
  sensitive: true
  type: true
